name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry
      - run: npx playwright install --with-deps chromium
      - name: Check pages
        run: npm run check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
